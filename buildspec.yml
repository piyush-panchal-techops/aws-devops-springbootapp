version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR....
      # Check AWS CLI version
      - aws --version
      # Log in to Amazon ECR
      #- aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/x8f9g6b5
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 414069231810.dkr.ecr.us-east-1.amazonaws.com
      # Define repository URI and image tag
      #- REPOSITORY_URI=public.ecr.aws/x8f9g6b5/springbootapp
      -  REPOSITORY_URI=414069231810.dkr.ecr.us-east-1.amazonaws.com/capstoneprojectecrrepo
      - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')
  build:
    commands:
      - echo Build started on date
      - echo Building the JAR file1...
      # Build the Java project using Maven
      - mvn clean install
      - echo Building the Docker image...
      # Build and tag Docker image
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on date
      - echo Pushing the Docker image to ECR...
      # Push Docker images to ECR
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      # Define container name and create imagedefinitions.json for ECS
      - DOCKER_CONTAINER_NAME=springboot
      - printf '[{"name":"%s","imageUri":"%s"}]' $DOCKER_CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - echo $DOCKER_CONTAINER_NAME
      - echo Displaying imagedefinitions.json content
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - target/springboot-aws-deploy.jar
